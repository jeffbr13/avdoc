[project]
name = "avdoc"
version = "0.6.4"
description = "CLI tool to generate HTML documentation for an Apache Avro schema"
authors = [{ name = "Ben Jeffrey", email = "mail@benjeffrey.net" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = [
    "avro",
    "avro-schema",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: HTML",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "avro>=1.12.0,<2",
    "dominate>=2.8.0,<3",
    "pygraphviz>=1.11,<2",
    "mistune>=3.3.0,<4",
]

[project.urls]
Repository = "https://github.com/jeffbr13/avdoc"

[project.scripts]
avdoc = "avdoc.__main__:main"

[dependency-groups]
dev = [
    "bump2version>=1.0.1,<2",
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# Same line-length as black:
line-length = 88

[tool.ruff.lint]
ignore = [
    "F403", # https://docs.astral.sh/ruff/rules/undefined-local-with-import-star/
    "F405" # https://docs.astral.sh/ruff/rules/undefined-local-with-import-star-usage/
]
